spring:
  datasource:
    url: jdbc:mysql://localhost:3306/laiwu_tourism?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000
    
  # 安全配置
  security:
    user:
      name: admin
      password: admin123

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laiwu.tourism.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api

# JWT配置
jwt:
  secret: laiwu_tourism_secret_key_2024
  expiration: 86400000  # 24小时

# 微信小程序配置
wechat:
  app_id: wx_app_id
  app_secret: wx_app_secret
  
# 跨域配置
cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"